[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["jobs", "ingestion", "export"]
src_paths = ["jobs", "ingestion", "export", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["jobs", "ingestion", "export", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
