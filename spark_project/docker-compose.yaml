services:
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-formation:4.1.3
    container_name: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --webui-port 8081
    ports:
      - "8081:8081"  # UI du master (8080 est deja pris par Airflow)
      - "7077:7077"  # port RPC pour spark-submit
    environment:
      # Sans ca, les liens stderr/stdout de l'UI pointent vers l'IP interne
      # Docker du conteneur, injoignable depuis le navigateur sur l'hote.
      SPARK_PUBLIC_DNS: localhost
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data:/opt/spark-data
      - ./settings.py:/opt/spark-jobs/settings.py
      - ./export:/opt/export
      - ./settings.py:/opt/export/settings.py
      # Driver JDBC Postgres par defaut, evite --packages a chaque submit.
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf
    networks:
      - default
      - formation_network

  spark-worker-1:
    image: spark-formation:4.1.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 1G --webui-port 8082
      spark://spark-master:7077
    ports:
      - "8082:8082"  # UI du worker 1
    environment:
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data:/opt/spark-data
    networks:
      - default
      - formation_network

  spark-worker-2:
    image: spark-formation:4.1.3
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 1G --webui-port 8083
      spark://spark-master:7077
    ports:
      - "8083:8083"  # UI du worker 2
    environment:
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data:/opt/spark-data
    networks:
      - default
      - formation_network

  spark-worker-3:
    image: spark-formation:4.1.3
    container_name: spark-worker-3
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      --cores 1 --memory 1G --webui-port 8084
      spark://spark-master:7077
    ports:
      - "8084:8084"  # UI du worker 3
    environment:
      SPARK_PUBLIC_DNS: localhost
    volumes:
      - ./jobs:/opt/spark-jobs
      - ./data:/opt/spark-data
    networks:
      - default
      - formation_network

  # Base "raw" des pipelines ELT, destination des jobs Spark. Sur
  # formation_network pour etre accessible depuis Spark et Airflow.
  postgres-raw:
    image: postgres:16
    container_name: postgres-raw
    environment:
      POSTGRES_USER: raw
      POSTGRES_PASSWORD: raw
      POSTGRES_DB: raw_data
    ports:
      - "5433:5432"  # acces depuis l'hote pour inspection (psql, DBeaver, ...)
    volumes:
      - postgres-raw-data:/var/lib/postgresql/data
      - ./sql/init_raw_db.sql:/docker-entrypoint-initdb.d/init_raw_db.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "raw", "-d", "raw_data"]
      interval: 10s
      retries: 5
      start_period: 5s
    networks:
      - default
      - formation_network

networks:
  formation_network:
    external: true

volumes:
  postgres-raw-data:
