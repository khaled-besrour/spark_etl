name: CI - Airflow

on:
  push:
    branches: [main]
    paths:
      - "airflow_project/**"
      - ".github/workflows/ci-airflow.yml"
  pull_request:
    branches: [main]
    paths:
      - "airflow_project/**"
      - ".github/workflows/ci-airflow.yml"

defaults:
  run:
    working-directory: airflow_project

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: airflow_project/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check --diff dags tests

      - name: Check import order (isort)
        run: isort --check-only --diff dags tests

      - name: Lint (ruff)
        run: ruff check dags tests

  test:
    name: Unit tests (DAG integrity)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: airflow_project/requirements-dev.txt

      - name: Set up Java (requis par le provider Spark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow_project
        run: python -m pytest tests --maxfail=1 -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image (latest)
        if: github.event_name == 'push'
        run: |
          docker tag airflow-formation:3.3.1 ghcr.io/khaled-besrour/airflow-formation:latest
          docker push ghcr.io/khaled-besrour/airflow-formation:latest
