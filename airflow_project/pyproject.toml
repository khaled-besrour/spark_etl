[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["dags"]
src_paths = ["dags", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["dags", "tests", "."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
